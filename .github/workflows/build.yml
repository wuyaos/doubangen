name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install eframe X11 / Wayland deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-shape0-dev libxcb-xfixes0-dev libx11-dev \
            libxrandr-dev libxinerama-dev libxi-dev libgl1-mesa-dev \
            libudev-dev libwayland-dev libxkbcommon-dev
      - name: Build (release)
        run: cargo build --release --locked
      - name: Package
        run: |
          mkdir -p dist
          cp target/release/doubangen dist/
          cp config.example.toml dist/
      - uses: actions/upload-artifact@v4
        with:
          name: doubangen-linux
          path: dist/

  build-windows:
    # 用 ubuntu 交叉编译 x86_64-pc-windows-gnu，复用本地验证过的工具链
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - name: Install mingw-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64
      - name: Build (release, windows-gnu)
        run: cargo build --release --locked --target x86_64-pc-windows-gnu
        env:
          CARGO_BUILD_JOBS: '2'
      - name: Package
        run: |
          mkdir -p dist
          cp target/x86_64-pc-windows-gnu/release/doubangen.exe dist/
          cp config.example.toml dist/
      - uses: actions/upload-artifact@v4
        with:
          name: doubangen-windows
          path: dist/

  release:
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Zip
        run: |
          cd artifacts
          zip -r ../doubangen-linux.zip doubangen-linux
          zip -r ../doubangen-windows.zip doubangen-windows
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            doubangen-linux.zip
            doubangen-windows.zip
